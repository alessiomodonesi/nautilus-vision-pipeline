# parametri hardware per camera_ros - camera sinistra (lx)
/stereo/lx/camera:
  ros__parameters:
    camera: 0
    width: 1280
    height: 720
    FrameDurationLimits: [200000, 200000]   # 200ms => 5 FPS
    # lock fotometrico: niente auto-exposure, niente auto-WB
    AeEnable: false
    AwbEnable: false
    ExposureTime: 20000
    ColourGains: [1.5, 1.5]
    # messa a fuoco manuale: lx=2.6 diottrie (offset meccanico +1.05 vs rx)
    # se camera_ros non accetta AfMode o LensPosition al boot, vengono comunque riapplicati da lock_cameras.py
    AfMode: 0
    LensPosition: 2.6

# parametri hardware per camera_ros - camera destra (rx)
/stereo/rx/camera:
  ros__parameters:
    camera: 1
    width: 1280
    height: 720
    FrameDurationLimits: [200000, 200000]
    AeEnable: false
    AwbEnable: false
    ExposureTime: 20000
    ColourGains: [1.5, 1.5]
    AfMode: 0
    LensPosition: 1.5

# parametri del nodo di benchmark
/**/metrics_node:
  ros__parameters:
    left_topic: '/stereo/lx/camera/image_raw'
    right_topic: '/stereo/rx/camera/image_raw'
    sync_slop_sec: 0.05         # tolleranza skew per message_filters
    window_size: 30             # frame usati per std/jitter
    log_interval_sec: 1.0       # ogni quanto stampare le metriche
    display: false              # true => apre finestra OpenCV