detection_node:
  ros__parameters:
    # questi sono i DEFAULT, sovrascrivibili a runtime via launch args:
    # model_filename_override, half_res_override, imgsz_override, input_type_override, enable_debug
    model_filename: 'yolov8n.pt'
    conf_threshold: 0.4
    input_type: 'raw'
    enable_debug: False
    half_res: True
    imgsz: 640
    num_threads: 2
    sync_slop_sec: 0.05